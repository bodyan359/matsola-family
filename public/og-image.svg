<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="75%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E58542" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#E58542" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161412"/>
      <stop offset="100%" stop-color="#0E0D0B"/>
    </linearGradient>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#ffffff" opacity="0.025"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#grain)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Faint background "FAMILY" wordmark -->
  <text x="1180" y="780" font-family="Playfair Display, Times New Roman, serif" font-style="italic" font-size="380" font-weight="500" fill="#E58542" opacity="0.05" text-anchor="end">FAMILY</text>

  <!-- ESTD line -->
  <line x1="80" y1="120" x2="120" y2="120" stroke="#8A7E66" stroke-width="1"/>
  <text x="135" y="125" font-family="Manrope, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#B5A88A">ESTD · FAMILY · 2025</text>

  <!-- Brand wordmark -->
  <text x="80" y="240" font-family="Playfair Display, Times New Roman, serif" font-style="italic" font-size="110" font-weight="500" fill="#F2EBD8" letter-spacing="-2">Matsola</text>

  <!-- Headline -->
  <text x="80" y="370" font-family="Playfair Display, Times New Roman, serif" font-style="italic" font-size="76" font-weight="400" fill="#F2EBD8">Не змінюй ритм.</text>
  <text x="80" y="450" font-family="Playfair Display, Times New Roman, serif" font-style="italic" font-size="76" font-weight="500" fill="#E58542">Просто їм.</text>

  <!-- Subtitle -->
  <text x="80" y="510" font-family="Cormorant Garamond, Times New Roman, serif" font-style="italic" font-size="28" fill="#DDD0B0">Курячі слайси та кабаноси · 71% білків · без сої</text>

  <!-- Badge -->
  <circle cx="970" cy="315" r="120" fill="#E58542"/>
  <circle cx="970" cy="315" r="112" fill="none" stroke="#0E0D0B" stroke-width="1.5" stroke-dasharray="3 4"/>
  <text x="970" y="320" font-family="Playfair Display, Times New Roman, serif" font-style="italic" font-size="56" font-weight="700" fill="#0E0D0B" text-anchor="middle">71%</text>
  <text x="970" y="358" font-family="Manrope, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#0E0D0B" text-anchor="middle">БІЛКІВ</text>

  <!-- Pack silhouette (decorative) -->
  <rect x="700" y="100" width="180" height="430" rx="14" fill="#0a0a0a" stroke="#E58542" stroke-width="1" opacity="0.75"/>
  <text x="790" y="155" font-family="Playfair Display, Times New Roman, serif" font-style="italic" font-size="34" font-weight="500" fill="#F2EBD8" text-anchor="middle">Matsola</text>
  <text x="790" y="175" font-family="Manrope, system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="3" fill="#B5A88A" text-anchor="middle">FAMILY · ESTD 2025</text>
  <rect x="720" y="195" width="140" height="220" rx="6" fill="#5a2b14"/>
  <ellipse cx="755" cy="305" rx="12" ry="60" fill="#2e1a0e" opacity="0.55"/>
  <ellipse cx="790" cy="305" rx="12" ry="60" fill="#1c100a" opacity="0.7"/>
  <ellipse cx="825" cy="305" rx="12" ry="60" fill="#2e1a0e" opacity="0.55"/>
  <text x="790" y="455" font-family="Manrope, system-ui, sans-serif" font-size="18" font-weight="800" letter-spacing="2" fill="#E58542" text-anchor="middle">КАБАНОСИ</text>
  <text x="790" y="475" font-family="Manrope, system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="3" fill="#E58542" text-anchor="middle">КЛАСИЧНІ</text>
  <text x="790" y="515" font-family="Manrope, system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="2" fill="#B5A88A" text-anchor="middle">ВАГА 80 Г</text>

  <!-- Bottom tagline -->
  <line x1="80" y1="570" x2="1120" y2="570" stroke="#E58542" stroke-width="1" opacity="0.3"/>
  <text x="80" y="600" font-family="Manrope, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#8A7E66">MATSOLA FAMILY · ППБ З 2004 · УКРАЇНА</text>
  <text x="1120" y="600" font-family="Cormorant Garamond, Times New Roman, serif" font-style="italic" font-size="20" fill="#E58542" text-anchor="end">створюємо для вас тільки найкраще</text>
</svg>
